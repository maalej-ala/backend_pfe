spring.application.name=backend
# ================== Database Configuration ==================
spring.datasource.url=jdbc:postgresql://localhost:5432/pfeprojetdb
spring.datasource.username=monuser
spring.datasource.password=monpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ================== JPA / Hibernate ==================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ================== JPA / Hibernate ==================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================== Connection Pool (optionnel) ==================
spring.datasource.initialization-mode=always
spring.datasource.max-active=10
spring.datasource.max-idle=5
spring.datasource.min-idle=2
spring.datasource.test-on-borrow=true
spring.datasource.validation-query=SELECT 1

# ================== Tesseract OCR ==================
# Linux  : /usr/share/tesseract-ocr/4.00/tessdata
# Windows: C:/Program Files/Tesseract-OCR/tessdata
tesseract.datapath=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=fra

# ================== Upload limits ==================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
